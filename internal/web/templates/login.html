{{define "login.html"}}<!doctype html>
<html lang="{{.PanelLanguage}}" dir="{{.Direction}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Settings.BusinessName}} — {{tr .PanelLanguage "sign_in"}}</title><link rel="stylesheet" href="/static/app.css?v=8"></head>
<body class="login-body theme-{{.PanelTheme}}"><main class="login-card"><div class="brand-mark">OR</div><p class="eyebrow">OPENRECEPTION</p><h1>{{tr .PanelLanguage "welcome_back"}}</h1><p class="muted">{{tr .PanelLanguage "login_copy"}}</p>{{if .Error}}<div class="notice error">{{.Error}}</div>{{end}}<form method="post" action="/admin/login"><label>{{tr .PanelLanguage "panel_password"}}<input type="password" name="password" autocomplete="current-password" required autofocus></label><button type="submit">{{tr .PanelLanguage "open_dashboard"}}</button></form></main></body></html>{{end}}
